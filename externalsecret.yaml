apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todo-db-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore

  target:
    name: postgres-secret

  data:
  - secretKey: POSTGRES_HOST
    remoteRef:
      key: todo-db-secret-2
      property: DB_HOST

  - secretKey: POSTGRES_USER
    remoteRef:
      key: todo-db-secret-2
      property: DB_USER

  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: todo-db-secret-2
      property: DB_PASS

  - secretKey: POSTGRES_DB
    remoteRef:
      key: todo-db-secret-2
      property: DB_NAME
